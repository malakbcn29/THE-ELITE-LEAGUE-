<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrations page</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="Reg_page_top">
        <div class="corner_logo">
            <img src="../resources/logo.png" alt="" style="width: 100%  ; height:100%;">
        </div>
        <div class="title">
            <h1> REGISTER NOW</h1>
            <p>Get personalized guidance from seasoned professionals who will help you level up</p>
            <p> your game</p>
        </div>
    
    </div>

    <div class="Reg_page_bottom">
             <form>
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="text" placeholder="Enter your number">

            <label>Country</label>
            <input type="text" placeholder="Enter your country">

            <label>Experience Level</label>
            <input type="text" placeholder="Beginner / Intermediate / Expert">

            <label>Your Goal</label>
            <input type="text" placeholder="Tell us why you want to join">
            <button id="submit"> Submit</button>
        </form>

          <div class="info_card">
            <img src="../resources/right-image.png" alt="" style="width: 100%  ; height:100%;">
        </div>
    </div>
   
</body>
</html>
